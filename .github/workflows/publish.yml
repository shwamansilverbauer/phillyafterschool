# Builds the site whenever main changes, and once a night, and publishes the finished files to the "live" branch.
# The web host deploys the "live" branch, so merging a change to main is all it takes to update the site.
name: Build and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 8 * * *'   # every night, about 4:23am in Philadelphia in summer and 3:23am in winter: a day off that has gone by comes off the pages
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build (stops here if the data has a problem)
        run: node build.mjs

      # The tests (tests/README.md) run against their own copy, built for a fixed day and served by PHP on this
      # machine, with stand-ins for the mail, sign-in and push services: nothing reaches the live site. A failure
      # stops the publish, so a change that breaks one of the site's rules never reaches the live branch.
      - name: Playwright for the browser tests (the browser is cached between runs)
        id: pw
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Chromium (and what it needs on this machine)
        run: npx playwright install --with-deps chromium
      - name: Test (stops here if a test fails)
        run: |
          php --version | head -1
          node tests/run.mjs
      - name: Keep the screenshots of anything that failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: tests/.scratch/shots/
          retention-days: 7
          if-no-files-found: ignore

      # Each day-off, school, summer-camp and weekend page's own link-preview picture, drawn from the page as built (its
      # headline and first line, as edited) by scripts/share-pictures.js --pages, with the Chromium the tests used. A
      # picture that can't be drawn gets the site-wide one in its place, so this step never stops a publish.
      - name: Link-preview pictures for the pages
        run: node scripts/share-pictures.js --pages

      # Kept for the last step: what the live site's sitemap said before this publish.
      - name: Note what the live sitemap says now
        run: curl -fsS -m 20 -o before-sitemap.xml "$(node -p "require('./site.config.json').siteUrl")/sitemap.xml" || echo "The live sitemap could not be read. That only means no pages are reported as changed this time."

      - name: Publish dist/ to the live branch
        env:
          REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads "$REMOTE" live >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch live "$REMOTE" out
          else
            mkdir out && git -C out init --quiet -b live && git -C out remote add origin "$REMOTE"
          fi
          find out -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a dist/. out/
          cd out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The built site is unchanged. Nothing to publish."
          else
            git commit --quiet -m "Publish site from ${GITHUB_SHA::7}"
            git push --quiet origin live
          fi

      # Bing and the search engines that share its index: here are the pages that changed. Never fails the job.
      - name: Tell search engines which pages changed
        run: node scripts/indexnow.mjs before-sitemap.xml dist/sitemap.xml || true
