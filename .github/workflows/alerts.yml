# Every morning: work out which subscribers are due a "dates" email and tell Klaviyo.
# Most mornings there is nothing to send and the job ends in a few seconds.
# It is started every hour because GitHub runs scheduled jobs late, sometimes by hours. Only a run that lands
# between 7:50 and 11:50 in the morning, Philadelphia time, does anything; the rest stop at the first step. The
# first one is due at 7:55, so emails go out at about 8.
# Nothing sends twice: Klaviyo keeps only the first copy of each email.
# It needs two repository secrets, KLAVIYO_API_KEY and ALERTS_TOKEN, and does nothing without them.
name: Send date emails

on:
  schedule:
    - cron: '55 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only count what would be sent'
        type: boolean
        default: true
      today:
        description: 'Pretend it is this day (YYYY-MM-DD). Dry runs only.'
        required: false
      hourly_only:
        description: 'Only the site’s hourly jobs now (new-account notes, the copy off the host). No emails.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: alerts
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Is it morning in Philadelphia?
        id: clock
        run: |
          now=$(TZ=America/New_York date +%H%M)
          echo "It is $now in Philadelphia."
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.hourly_only }}" = "true" ]; then echo "Only the site's hourly jobs this time."
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "$((10#$now))" -ge 750 ] && [ "$((10#$now))" -lt 1150 ]; }; then echo "go=yes" >> "$GITHUB_OUTPUT"; else echo "Outside 7:50 to 11:50, so there are no emails to work out."; fi

      # Every other hour of the day: the site's own hourly work, which needs nothing from here but the call. It sends the
      # owner's notes about new accounts, and once a day the encrypted copy of the database off the host (to the
      # private backup repository) with its restore drill. In the morning send-alerts.mjs makes this same call itself.
      # Only counts and a state come back (never who); a refused or slow answer just waits for the next hour.
      - name: The site's hourly jobs
        if: steps.clock.outputs.go != 'yes'
        run: |
          curl -sS -m 150 -X POST -H 'X-PAS: 1' -H 'content-type: application/json' -H 'accept: application/json' -d '{}' \
            'https://phillyafterschool.org/groups/api.php?action=push_run' | jq -c '{told, why, offsite}' || echo "The site didn't answer this time; the next hour asks again."

      # The whole history, not just the latest commit: the build reads it to see when each date was posted.
      - uses: actions/checkout@v4
        if: steps.clock.outputs.go == 'yes'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: steps.clock.outputs.go == 'yes'
        with:
          node-version: 20

      - name: Build the site, which writes the dates feed
        if: steps.clock.outputs.go == 'yes'
        run: node build.mjs

      - name: Tell Klaviyo who is due an email
        if: steps.clock.outputs.go == 'yes'
        env:
          KLAVIYO_API_KEY: ${{ secrets.KLAVIYO_API_KEY }}
          ALERTS_TOKEN: ${{ secrets.ALERTS_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          TODAY: ${{ github.event_name == 'workflow_dispatch' && inputs.today || '' }}
        run: |
          set -- 
          if [ "$DRY_RUN" = "true" ]; then set -- "$@" --dry-run; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$DRY_RUN" != "true" ]; then set -- "$@" --any-time; fi
          if [ "$DRY_RUN" = "true" ] && [ -n "$TODAY" ]; then set -- "$@" --today "$TODAY"; fi
          node scripts/send-alerts.mjs "$@"
